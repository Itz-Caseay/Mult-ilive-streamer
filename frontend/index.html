<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multicast — Go live everywhere at once</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="deck">

  <header class="deck__header">
    <div class="deck__brand">
      <span class="deck__dot" id="masterDot"></span>
      <h1>Multicast</h1>
    </div>
    <div class="deck__master">
      <span class="deck__masterLabel" id="masterLabel">Off air</span>
      <button id="goLiveBtn" class="btn btn--live">Go live</button>
    </div>
  </header>

  <main class="deck__body">

    <section class="preview">
      <video id="sourceVideo" autoplay muted playsinline style="display:none"></video>
      <canvas id="outputCanvas" width="1280" height="720"></canvas>

      <div class="preview__controls">
        <div class="sourceToggle" role="group" aria-label="Video source">
          <button id="sourceCamBtn" class="btn btn--ghost" data-active="true">Camera</button>
          <button id="sourceScreenBtn" class="btn btn--ghost">Screen</button>
        </div>
        <button id="micBtn" class="btn btn--ghost" data-active="true">Mic</button>
      </div>

      <div class="logoPanel">
        <div class="logoPanel__row">
          <label class="logoPanel__file">
            <input type="file" id="logoInput" accept="image/*" hidden>
            <span id="logoFileLabel">Add channel logo</span>
          </label>
          <button id="logoClearBtn" class="btn btn--ghost btn--small" hidden>Remove</button>
        </div>
        <div class="logoPanel__row logoPanel__controls" id="logoControls" hidden>
          <select id="logoCorner">
            <option value="top-left">Top left</option>
            <option value="top-right" selected>Top right</option>
            <option value="bottom-left">Bottom left</option>
            <option value="bottom-right">Bottom right</option>
          </select>
          <label class="logoPanel__slider">
            Size
            <input type="range" id="logoSize" min="5" max="30" value="14">
          </label>
          <label class="logoPanel__slider">
            Opacity
            <input type="range" id="logoOpacity" min="20" max="100" value="100">
          </label>
        </div>
      </div>

      <div class="console" id="console" aria-live="polite"></div>
    </section>

    <section class="channels">
      <div class="channels__head">
        <h2>Destinations</h2>
        <span class="channels__count" id="channelCount">0 configured</span>
      </div>

      <ul class="channelList" id="channelList"></ul>

      <form class="addChannel" id="addChannelForm">
        <div class="addChannel__row">
          <select id="platformSelect">
            <option value="youtube">YouTube</option>
            <option value="twitch">Twitch</option>
            <option value="facebook">Facebook</option>
            <option value="tiktok">TikTok</option>
            <option value="custom">Custom RTMP</option>
          </select>
          <input type="text" id="rtmpUrlInput" placeholder="RTMP server URL" required>
        </div>
        <div class="addChannel__row">
          <input type="password" id="streamKeyInput" placeholder="Stream key" required>
          <button type="button" id="toggleKeyVisibility" class="btn btn--ghost btn--small">Show</button>
        </div>
        <button type="submit" class="btn btn--add">Add destination</button>
      </form>

      <p class="note">
        Stream keys stay in this browser tab and are sent only to your own local server below — never to a third party.
      </p>
    </section>

  </main>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
